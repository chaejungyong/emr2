<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1100" height="730" fill="#ffffff"/>

  <text x="550" y="42" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">프로젝트 구조도 (Flask + MariaDB)</text>

  <!-- Browser -->
  <rect x="30" y="200" width="150" height="80" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="235" font-size="16" font-weight="bold" text-anchor="middle" fill="#0c4a6e">사용자 브라우저</text>
  <text x="105" y="258" font-size="13" text-anchor="middle" fill="#0c4a6e">http://NAS:8081</text>

  <!-- NAS host -->
  <rect x="215" y="75" width="860" height="440" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="235" y="100" font-size="16" font-weight="bold" fill="#334155">Synology NAS (호스트)</text>
  <text x="235" y="122" font-size="12" fill="#94a3b8">DSM nginx: 8081로 직접 접속하면 거치지 않음</text>

  <!-- Host port -->
  <rect x="235" y="212" width="120" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="295" y="236" font-size="13" text-anchor="middle" fill="#78350f">호스트 포트</text>
  <text x="295" y="256" font-size="16" font-weight="bold" text-anchor="middle" fill="#78350f">8081</text>

  <!-- Docker network -->
  <rect x="390" y="135" width="665" height="365" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="405" y="157" font-size="13" fill="#475569">Docker 네트워크 (emr2_default)</text>

  <!-- app-web -->
  <rect x="415" y="170" width="285" height="170" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="557" y="197" font-size="16" font-weight="bold" text-anchor="middle" fill="#14532d">app-web 컨테이너</text>
  <text x="557" y="220" font-size="13" text-anchor="middle" fill="#14532d">Flask (Werkzeug 개발 서버)</text>
  <text x="557" y="242" font-size="13" text-anchor="middle" fill="#14532d">0.0.0.0:5000 에서 대기</text>
  <text x="435" y="275" font-size="13" fill="#14532d">GET /            → static/index.html</text>
  <text x="435" y="297" font-size="13" fill="#14532d">GET /api/health  → DB 연결 확인</text>
  <text x="435" y="324" font-size="11" fill="#166534">python app.py (Dockerfile CMD)</text>

  <!-- app-db -->
  <rect x="760" y="170" width="270" height="170" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="895" y="197" font-size="16" font-weight="bold" text-anchor="middle" fill="#3b0764">app-db 컨테이너</text>
  <text x="895" y="222" font-size="13" text-anchor="middle" fill="#3b0764">MariaDB 10.6</text>
  <text x="895" y="246" font-size="13" text-anchor="middle" fill="#3b0764">포트 3306 (내부 전용, 외부 노출 없음)</text>
  <text x="895" y="270" font-size="13" text-anchor="middle" fill="#3b0764">DB: app_db</text>
  <text x="895" y="294" font-size="13" text-anchor="middle" fill="#3b0764">호스트 이름: db</text>

  <!-- Volumes -->
  <rect x="415" y="395" width="285" height="85" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="557" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">소스 코드 마운트</text>
  <text x="557" y="443" font-size="12" text-anchor="middle" fill="#334155">/volume1/docker/emr2 → /app</text>
  <text x="557" y="464" font-size="11" text-anchor="middle" fill="#64748b">코드 수정 시 자동 재시작 (FLASK_DEBUG=1)</text>

  <rect x="760" y="395" width="270" height="85" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="895" y="420" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">DB 데이터 마운트</text>
  <text x="895" y="443" font-size="12" text-anchor="middle" fill="#334155">./db_data → /var/lib/mysql</text>
  <text x="895" y="464" font-size="11" text-anchor="middle" fill="#64748b">git 제외 (.gitignore)</text>

  <!-- Request flow arrows -->
  <line x1="180" y1="240" x2="233" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="355" y1="240" x2="413" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="384" y="228" font-size="12" text-anchor="middle" fill="#b45309" font-weight="bold">→ 5000</text>
  <line x1="700" y1="255" x2="758" y2="255" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="729" y="243" font-size="11" text-anchor="middle" fill="#334155">pymysql</text>
  <text x="729" y="275" font-size="11" text-anchor="middle" fill="#334155">db:3306</text>

  <!-- Volume links -->
  <line x1="557" y1="340" x2="557" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="895" y1="340" x2="895" y2="395" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Port config chain -->
  <text x="40" y="562" font-size="17" font-weight="bold" fill="#0f172a">포트 8081이 정해지는 곳</text>

  <rect x="40" y="580" width="300" height="110" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="190" y="610" font-size="15" font-weight="bold" text-anchor="middle" fill="#78350f">.env</text>
  <text x="190" y="640" font-size="15" text-anchor="middle" fill="#78350f" font-family="monospace">WEB_PORT=8081</text>
  <text x="190" y="672" font-size="12" text-anchor="middle" fill="#92400e">외부(호스트)에 여는 포트 번호</text>

  <rect x="400" y="580" width="320" height="110" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="560" y="610" font-size="15" font-weight="bold" text-anchor="middle" fill="#0c4a6e">docker-compose.yml</text>
  <text x="560" y="640" font-size="15" text-anchor="middle" fill="#0c4a6e" font-family="monospace">ports: "${WEB_PORT}:5000"</text>
  <text x="560" y="672" font-size="12" text-anchor="middle" fill="#075985">호스트 8081 ↔ 컨테이너 5000 연결</text>

  <rect x="780" y="580" width="280" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="920" y="610" font-size="15" font-weight="bold" text-anchor="middle" fill="#14532d">app.py</text>
  <text x="920" y="640" font-size="15" text-anchor="middle" fill="#14532d" font-family="monospace">app.run(port=5000)</text>
  <text x="920" y="672" font-size="12" text-anchor="middle" fill="#166534">컨테이너 안에서 Flask가 듣는 포트</text>

  <line x1="340" y1="635" x2="398" y2="635" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="635" x2="778" y2="635" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
