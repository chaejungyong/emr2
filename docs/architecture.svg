<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="600" y="42" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">CardioSOAP Vet Architecture</text>
  <text x="600" y="67" font-size="13" text-anchor="middle" fill="#64748b">Flask + MariaDB + Qdrant on Synology Docker Compose</text>

  <rect x="18" y="295" width="155" height="84" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="95" y="327" font-size="16" font-weight="bold" text-anchor="middle" fill="#0c4a6e">Browser</text>
  <text x="95" y="350" font-size="12" text-anchor="middle" fill="#0c4a6e">Vanilla JS UI</text>
  <text x="95" y="368" font-size="11" text-anchor="middle" fill="#0c4a6e">NAS:8081</text>

  <rect x="205" y="92" width="780" height="610" rx="16" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="228" y="120" font-size="16" font-weight="bold" fill="#334155">Synology NAS / Docker network: emr2_default</text>

  <rect x="245" y="165" width="265" height="180" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="377" y="194" font-size="17" font-weight="bold" text-anchor="middle" fill="#14532d">app-web</text>
  <text x="377" y="217" font-size="13" text-anchor="middle" fill="#14532d">Gunicorn + Flask :5000</text>
  <text x="265" y="247" font-size="12" fill="#14532d">- Session auth + CSRF</text>
  <text x="265" y="269" font-size="12" fill="#14532d">- Clinical and SOAP APIs</text>
  <text x="265" y="291" font-size="12" fill="#14532d">- RAG search and AI calls</text>
  <text x="265" y="313" font-size="12" fill="#14532d">- Authenticated X-ray serving</text>

  <rect x="245" y="430" width="265" height="175" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="377" y="459" font-size="17" font-weight="bold" text-anchor="middle" fill="#78350f">app-worker</text>
  <text x="377" y="482" font-size="13" text-anchor="middle" fill="#78350f">Python indexing loop</text>
  <text x="265" y="512" font-size="12" fill="#78350f">- Claims MariaDB index jobs</text>
  <text x="265" y="534" font-size="12" fill="#78350f">- Extracts and chunks PDFs</text>
  <text x="265" y="556" font-size="12" fill="#78350f">- Embeds in batches</text>
  <text x="265" y="578" font-size="12" fill="#78350f">- Updates Qdrant aliases</text>

  <rect x="625" y="150" width="285" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="767" y="181" font-size="17" font-weight="bold" text-anchor="middle" fill="#3b0764">app-db</text>
  <text x="767" y="205" font-size="13" text-anchor="middle" fill="#3b0764">MariaDB 10.6 / app_db</text>
  <text x="647" y="237" font-size="12" fill="#3b0764">Source of truth:</text>
  <text x="647" y="259" font-size="12" fill="#3b0764">patients, encounters, SOAP,</text>
  <text x="647" y="281" font-size="12" fill="#3b0764">AI history, KB metadata, jobs</text>

  <rect x="625" y="410" width="285" height="170" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="767" y="441" font-size="17" font-weight="bold" text-anchor="middle" fill="#1e3a8a">app-qdrant</text>
  <text x="767" y="465" font-size="13" text-anchor="middle" fill="#1e3a8a">Qdrant 1.12.6 :6333</text>
  <text x="647" y="497" font-size="12" fill="#1e3a8a">Rebuildable PDF vectors</text>
  <text x="647" y="519" font-size="12" fill="#1e3a8a">Active alias: kb_active</text>
  <text x="647" y="541" font-size="12" fill="#1e3a8a">Not a clinical source of truth</text>

  <rect x="560" y="620" width="175" height="57" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="647" y="644" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">storage/knowledge/inbox</text>
  <text x="647" y="663" font-size="11" text-anchor="middle" fill="#64748b">Medical PDFs</text>

  <rect x="755" y="620" width="155" height="57" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="832" y="644" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">storage/xrays</text>
  <text x="832" y="663" font-size="11" text-anchor="middle" fill="#64748b">Original images</text>

  <rect x="1028" y="280" width="150" height="120" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="1103" y="311" font-size="16" font-weight="bold" text-anchor="middle" fill="#831843">OpenAI API</text>
  <text x="1103" y="338" font-size="12" text-anchor="middle" fill="#831843">GPT-5.6 Terra</text>
  <text x="1103" y="360" font-size="12" text-anchor="middle" fill="#831843">Embedding 3 Large</text>
  <text x="1103" y="382" font-size="10" text-anchor="middle" fill="#9d174d">Text only; no X-ray bytes</text>

  <line x1="173" y1="337" x2="243" y2="257" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="193" y="284" font-size="11" fill="#334155">HTTP</text>

  <line x1="510" y1="230" x2="623" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="218" font-size="11" text-anchor="middle" fill="#334155">clinical SQL</text>

  <line x1="510" y1="295" x2="623" y2="465" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="556" y="376" font-size="11" fill="#334155">Top-K search</text>

  <line x1="510" y1="488" x2="623" y2="282" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="525" y="403" font-size="11" fill="#334155">job status</text>

  <line x1="510" y1="527" x2="623" y2="507" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="566" y="536" font-size="11" text-anchor="middle" fill="#334155">batch upsert</text>

  <line x1="620" y1="620" x2="472" y2="605" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="832" y1="620" x2="488" y2="345" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="510" y1="200" x2="1026" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="841" y="247" font-size="11" fill="#334155">SOAP generation</text>

  <line x1="510" y1="475" x2="1026" y2="365" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="852" y="421" font-size="11" fill="#334155">PDF embeddings</text>

  <text x="600" y="738" font-size="12" text-anchor="middle" fill="#64748b">Only web:5000 is published as host WEB_PORT. MariaDB and Qdrant remain internal.</text>
</svg>
