services:
  db:
    image: mariadb:10.6
    container_name: ${PROJECT_NAME}-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - ./db_data:/var/lib/mysql

  web:
    build: .
    container_name: ${PROJECT_NAME}-web
    restart: always
    env_file: .env
    ports:
      - "${WEB_PORT}:5000"
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
